# Mutation testing of the tagger (IMP Rule 26). Run in WSL from the repo root:
#   ~/.venvs/findata/bin/mutmut run
# mutmut copies the files below into mutants/ (git-ignored) and mutates the copy only.
[mutmut]
source_paths=stock_processor/tagger_page.py
also_copy=
    stock_processor/test_tagger.py
    stock_processor/test_contract_tagger.py
    stock_processor/features
    docs/rasrich_tag_lists.csv
    docs/wave_mapping.csv
    docs/auto_rules.csv
pytest_add_cli_args_test_selection=
    stock_processor/test_contract_tagger.py
    stock_processor/test_tagger.py
pytest_add_cli_args=
    -p
    no:cacheprovider
    -W
    ignore::pytest.PytestUnknownMarkWarning
