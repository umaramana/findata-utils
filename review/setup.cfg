# Mutation testing of extraction (IMP). Run in WSL from review/:
#   .venv/bin/mutmut run
# mutmut copies the files below into mutants/ (git-ignored) and mutates the copy only.
# Delete mutants/ after a run: plain pytest in review/ collects its copies and fails on import.
# Pinned in review/.venv: mutmut==3.8.0 with pytest==9.1.1 (same as ~/.venvs/findata).
# mutmut 3.8.0 fails on pytest 9.2.0 ('Function' object has no attribute '_nodeid'),
# so don't upgrade pytest here without upgrading mutmut and re-running both mutation runs.
[mutmut]
source_paths=extract.py
also_copy=
    page_filter.py
    test_contract_extraction.py
    features
pytest_add_cli_args_test_selection=
    test_contract_extraction.py
pytest_add_cli_args=
    -p
    no:cacheprovider
    -W
    ignore::pytest.PytestUnknownMarkWarning
